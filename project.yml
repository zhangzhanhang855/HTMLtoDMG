name: JRmusic
options:
  bundleIdPrefix: com.jrmusic
  deploymentTarget:
    macOS: "12.0"
  projectFormat: xcode15_0
  postGenCommand: "sed -i.bak -E 's|objectVersion = [0-9]+|objectVersion = 56|' JRmusic.xcodeproj/project.pbxproj"
targets:
  JRmusic:
    type: application
    platform: macOS
    sources:
      - path: JRmusic
        excludes:
          - "Resources/www"
      - path: JRmusic/Resources/www
        buildPhase: resources
        type: folder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jrmusic.app
      INFOPLIST_FILE: JRmusic/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
