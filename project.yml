name: JRmusic
options:
  bundleIdPrefix: com.jrmusic
  deploymentTarget:
    macOS: "12.0"
targets:
  JRmusic:
    type: application
    platform: macOS
    sources:
      - path: JRmusic
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jrmusic.app
      INFOPLIST_FILE: JRmusic/Info.plist
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
