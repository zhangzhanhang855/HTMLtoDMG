name: Build JRmusic DMG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools
        run: |
          pip install Pillow
          brew install xcodegen

      - name: Select Compatible Xcode Version
        run: |
          # Use Xcode 15 or 16 if present, print active toolchain version
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Generate App Icon & Graphics
        run: |
          python3 scripts/generate_icons.py
          test -f "JRmusic/Resources/AppIcon.icns" || { echo "AppIcon.icns generation failed"; exit 1; }

      - name: Generate Xcode Project File
        run: |
          xcodegen generate

      - name: Compile macOS Application (.app)
        run: |
          xcodebuild clean build \
            -project JRmusic.xcodeproj \
            -scheme JRmusic \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="build_output/Build/Products/Release/JRmusic.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: JRmusic.app not found in build products"
            exit 1
          fi
          cp -R "$APP_PATH" ./JRmusic.app

      - name: Verify & Inject Web Warehouse Assets
        run: |
          TARGET_WWW="JRmusic.app/Contents/Resources/www"
          mkdir -p "$TARGET_WWW"

          # Copy frontend files directly into app bundle
          cp JRmusic/Resources/www/index.html "$TARGET_WWW/"
          cp JRmusic/Resources/www/app.js "$TARGET_WWW/"
          cp JRmusic/Resources/www/style.css "$TARGET_WWW/"

          # Verify files exist
          test -f "$TARGET_WWW/index.html" || { echo "Missing index.html"; exit 1; }
          test -f "$TARGET_WWW/app.js" || { echo "Missing app.js"; exit 1; }
          test -f "$TARGET_WWW/style.css" || { echo "Missing style.css"; exit 1; }

          echo "Bundle web assets verified successfully:"
          ls -la "$TARGET_WWW"

      - name: Apply Ad-hoc Signature & Executable Permissions
        run: |
          # Ensure execution bit is enabled on binaries
          chmod -R +x JRmusic.app/Contents/MacOS/

          # Remove quarantine metadata if inherited
          xattr -cr JRmusic.app

          # Ad-hoc sign bundle and subcomponents to prevent silent macOS Gatekeeper termination
          codesign --force --deep --sign - ./JRmusic.app

          # Verify signature structure
          codesign -dv --verbose=4 ./JRmusic.app

      - name: Assemble DMG Volume Root & Symlink
        run: |
          mkdir -p dmg_root
          cp -R JRmusic.app dmg_root/

          # Create standard Applications drag-and-drop symlink
          ln -s /Applications dmg_root/Applications

          # Add custom volume icon if available
          if [ -f "JRmusic/Resources/AppIcon.icns" ]; then
            cp "JRmusic/Resources/AppIcon.icns" dmg_root/.VolumeIcon.icns
          fi

      - name: Package Distributable DMG via Native hdiutil
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "JRmusic" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            dist/JRmusic.dmg

          hdiutil verify dist/JRmusic.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRmusic-macOS-Universal-DMG
          path: dist/JRmusic.dmg
          if-no-files-found: error
          retention-days: 14
