name: Build JRmusic DMG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools
        run: |
          pip install Pillow
          brew install xcodegen

      - name: Select Compatible Xcode Version
        run: |
          # 優先選擇相容的 Xcode 版本
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Generate App Icon & Graphics
        run: |
          python3 scripts/generate_icons.py
          test -f "JRmusic/Resources/AppIcon.icns" || { echo "AppIcon.icns 生成失敗"; exit 1; }

      - name: Generate Xcode Project File
        run: |
          xcodegen generate

      - name: Compile macOS Application (.app)
        run: |
          xcodebuild clean build \
            -project JRmusic.xcodeproj \
            -scheme JRmusic \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="build_output/Build/Products/Release/JRmusic.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "錯誤：未在編譯產物中找到 JRmusic.app"
            exit 1
          fi
          cp -R "$APP_PATH" ./JRmusic.app

      - name: Verify & Inject Web Warehouse Assets
        run: |
          # 建立目標資料夾（Contents/Resources/www）
          TARGET_WWW="JRmusic.app/Contents/Resources/www"
          TARGET_RES="JRmusic.app/Contents/Resources"
          mkdir -p "$TARGET_WWW"

          # 雙重注入：將前端資源同時複製至 www 子目錄與 Resources 根目錄，確保 100% 能被讀取
          cp JRmusic/Resources/www/index.html "$TARGET_WWW/"
          cp JRmusic/Resources/www/app.js "$TARGET_WWW/"
          cp JRmusic/Resources/www/style.css "$TARGET_WWW/"

          cp JRmusic/Resources/www/index.html "$TARGET_RES/"
          cp JRmusic/Resources/www/app.js "$TARGET_RES/"
          cp JRmusic/Resources/www/style.css "$TARGET_RES/"

          # 檢查資源完整性
          test -f "$TARGET_WWW/index.html" || { echo "缺少 index.html"; exit 1; }
          test -f "$TARGET_WWW/app.js" || { echo "缺少 app.js"; exit 1; }
          test -f "$TARGET_WWW/style.css" || { echo "缺少 style.css"; exit 1; }

          echo "網頁倉庫資源驗證完成："
          ls -la "$TARGET_WWW"

      - name: Apply Ad-hoc Signature & Executable Permissions
        run: |
          # 確保二進制執行檔許可權正確
          chmod -R +x JRmusic.app/Contents/MacOS/

          # 清除隔離屬性
          xattr -cr JRmusic.app

          # 本地 Ad-hoc 簽名，防止 macOS 核心靜默殺死進程
          codesign --force --deep --sign - ./JRmusic.app

          # 驗證簽名
          codesign -dv --verbose=4 ./JRmusic.app

      - name: Assemble DMG Volume Root & Symlink
        run: |
          mkdir -p dmg_root
          cp -R JRmusic.app dmg_root/

          # 建立 /Applications 替身連結
          ln -s /Applications dmg_root/Applications

          # 若存在圖標則加入至磁碟映像
          if [ -f "JRmusic/Resources/AppIcon.icns" ]; then
            cp "JRmusic/Resources/AppIcon.icns" dmg_root/.VolumeIcon.icns
          fi

      - name: Package Distributable DMG via Native hdiutil
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "JRmusic" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            dist/JRmusic.dmg

          hdiutil verify dist/JRmusic.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRmusic-macOS-Universal-DMG
          path: dist/JRmusic.dmg
          if-no-files-found: error
          retention-days: 14
