name: Build JRmusic DMG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-14

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Fallback to Latest)
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode* || true

          # Select the newest Xcode 16.x available; fallback gracefully if not found
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi

          echo "Active Xcode Version:"
          xcodebuild -version

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Build Tools
        run: |
          pip install Pillow
          brew install xcodegen

      - name: Generate App Icon (.icns) & Graphics
        run: |
          python3 scripts/generate_icons.py
          test -f "JRmusic/Resources/AppIcon.icns" || { echo "AppIcon generation failed"; exit 1; }

      - name: Generate Xcode Project File
        run: |
          # Use Xcode 14.0 compatibility project format as extra safety guard
          xcodegen generate --project-format "Xcode 14.0" || xcodegen generate

      - name: Compile macOS Application (.app)
        run: |
          xcodebuild clean build \
            -project JRmusic.xcodeproj \
            -scheme JRmusic \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="build_output/Build/Products/Release/JRmusic.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build error: JRmusic.app not found in products directory"
            exit 1
          fi
          cp -R "$APP_PATH" ./JRmusic.app

      - name: Verify & Inject Web Warehouse Assets
        run: |
          TARGET_WWW="JRmusic.app/Contents/Resources/www"
          mkdir -p "$TARGET_WWW"

          # Copy frontend files into the app bundle
          cp JRmusic/Resources/www/index.html "$TARGET_WWW/"
          cp JRmusic/Resources/www/app.js "$TARGET_WWW/"
          cp JRmusic/Resources/www/style.css "$TARGET_WWW/"

          # Ensure binary and directory permissions are correct
          chmod -R u+w JRmusic.app
          chmod +x JRmusic.app/Contents/MacOS/JRmusic

          echo "Bundle Assets Check:"
          ls -la "$TARGET_WWW"

          test -f "$TARGET_WWW/index.html" || { echo "Missing index.html"; exit 1; }
          test -f "$TARGET_WWW/app.js" || { echo "Missing app.js"; exit 1; }
          test -f "$TARGET_WWW/style.css" || { echo "Missing style.css"; exit 1; }

      - name: Apply Ad-Hoc Code Signature
        run: |
          # Ad-hoc sign the bundle with deep traversal so macOS accepts bundle integrity
          codesign --force --deep --sign - ./JRmusic.app

          # Verify the signature
          codesign --verify --verbose ./JRmusic.app

      - name: Assemble DMG Staging Root
        run: |
          mkdir -p dmg_root
          cp -R JRmusic.app dmg_root/
          ln -s /Applications dmg_root/Applications

          if [ -f "JRmusic/Resources/AppIcon.icns" ]; then
            cp "JRmusic/Resources/AppIcon.icns" dmg_root/.VolumeIcon.icns
          fi

      - name: Build DMG via Native hdiutil
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "JRmusic" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            dist/JRmusic.dmg

          # Ad-hoc sign the outer disk image
          codesign --force --sign - dist/JRmusic.dmg

          # Verify DMG file integrity
          hdiutil verify dist/JRmusic.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JRmusic-macOS-Universal-DMG
          path: dist/JRmusic.dmg
          if-no-files-found: error
          retention-days: 14
